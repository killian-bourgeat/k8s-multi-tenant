# A 2-node MongoDB replica set for high availability inside a tenant
# namespace. After applying, you must initiate the replica set by exec-ing
# into the first pod — see init.ts for the programmatic version.
#
# Required variables:
#   TENANT_ID   — unique slug (e.g. "acme-42")
#   STORAGE     — PVC size (e.g. "10Gi")
#   MONGO_TAG   — image tag (e.g. "7.0")

---
apiVersion: v1
kind: Service
metadata:
  name: mongo-${TENANT_ID}
  namespace: tenant-${TENANT_ID}
  labels:
    app: mongo-${TENANT_ID}
spec:
  clusterIP: None       # headless: gives each pod a stable DNS name
  selector:
    app: mongo-${TENANT_ID}
  ports:
    - port: 27017
      targetPort: 27017

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-${TENANT_ID}
  namespace: tenant-${TENANT_ID}
spec:
  serviceName: mongo-${TENANT_ID}
  replicas: 2
  selector:
    matchLabels:
      app: mongo-${TENANT_ID}
  template:
    metadata:
      labels:
        app: mongo-${TENANT_ID}
    spec:
      containers:
        - name: mongo
          image: mongo:${MONGO_TAG}
          command:
            - mongod
            - --bind_ip_all
            - --replSet
            - rs0
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: ${STORAGE}
