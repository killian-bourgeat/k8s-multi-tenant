# Minimal "tenant" used by demo.ts. Designed to run on a kind cluster with
# the nginx ingress controller installed.
#
# Variables:
#   TENANT_ID — unique slug
#   HOST      — hostname for the ingress (use *.localtest.me for local)

---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-${TENANT_ID}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-html
  namespace: tenant-${TENANT_ID}
data:
  index.html: |
    <html>
      <body>
        <h1>Hello from tenant ${TENANT_ID}</h1>
        <p>Host: ${HOST}</p>
      </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: tenant-${TENANT_ID}
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: nginx-html

---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: tenant-${TENANT_ID}
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: tenant-${TENANT_ID}
spec:
  ingressClassName: nginx
  rules:
    - host: ${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
