# Full per-tenant bundle: everything needed to spin up an isolated tenant on
# a shared cluster. Render with K8sTemplateEngine, then `manifests.apply()`.
#
# Required variables:
#   TENANT_ID   — unique slug for this tenant (e.g. "acme-42")
#   HOST        — hostname for the Ingress (e.g. "shop.acme.com")
#   IMAGE       — container image to run (e.g. "ghcr.io/org/app:1.0")
#   REPLICAS    — number of pod replicas (string, e.g. "2")
#   ISSUER      — cert-manager ClusterIssuer name (e.g. "letsencrypt-prod")

---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-${TENANT_ID}
  labels:
    app.kubernetes.io/managed-by: k8s-multitenants-saas
    tenant-id: ${TENANT_ID}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: tenant-${TENANT_ID}
data:
  TENANT_ID: ${TENANT_ID}
  HOST: ${HOST}
  LOG_LEVEL: info

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: tenant-${TENANT_ID}
type: Opaque
stringData:
  # Replace with real secret values rendered from your backend (never
  # commit real secrets to git).
  API_KEY: ${API_KEY}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-${TENANT_ID}
  namespace: tenant-${TENANT_ID}
  labels:
    app: app-${TENANT_ID}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: app-${TENANT_ID}
  template:
    metadata:
      labels:
        app: app-${TENANT_ID}
    spec:
      containers:
        - name: app
          image: ${IMAGE}
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: app-${TENANT_ID}
  namespace: tenant-${TENANT_ID}
spec:
  type: ClusterIP
  selector:
    app: app-${TENANT_ID}
  ports:
    - port: 80
      targetPort: 3000

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app-${TENANT_ID}
  namespace: tenant-${TENANT_ID}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: app-${TENANT_ID}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-${TENANT_ID}
  namespace: tenant-${TENANT_ID}
  annotations:
    cert-manager.io/cluster-issuer: ${ISSUER}
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${HOST}
      secretName: tls-${TENANT_ID}
  rules:
    - host: ${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-${TENANT_ID}
                port:
                  number: 80

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-${TENANT_ID}
  namespace: tenant-${TENANT_ID}
spec:
  secretName: tls-${TENANT_ID}
  issuerRef:
    name: ${ISSUER}
    kind: ClusterIssuer
  dnsNames:
    - ${HOST}
